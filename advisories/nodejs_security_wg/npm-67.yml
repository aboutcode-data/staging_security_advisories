summary: "Remote Memory Disclosure\nUPDATE Jan 6, 2016\n\nSome additional, [important details](https://gist.github.com/c0nrad/e92005446c480707a74a)\
  \ have been made available by Stuart Larsen. The client (which could in fact be the server\
  \ in certain instances) is that one that allocates and sends the memory that is then echo'd\
  \ by the server.\n\nA vulnerability was found in the ping functionality of the ws module which\
  \ allowed clients to allocate memory by sending a ping frame. The ping functionality by default\
  \ responds with a pong frame and the previously given payload of the ping frame. \n\nThis\
  \ is exactly what you expect, but internally ws always transforms all data that we need to\
  \ send to a Buffer instance and that is where the vulnerability existed. ws didn't do any\
  \ checks for the type of data it was sending. With buffers in node when you allocate it when\
  \ a number instead of a string it will allocate the amount of bytes.\n\n```\nvar x = new Buffer(100);\n\
  // vs\nvar x = new Buffer('100');\n```\n\nThis would allocate 100 bytes of memory in the first\
  \ example and just 3 bytes with 100 as value in the second example. So the client would allocate\
  \ 100 bytes of non-zeroed buffer and send that to the server. \n\n\n\n## Example POC\n```\n\
  var ws = require('ws')\n\nvar server = new ws.Server({ port: 9000 })\nvar client = new ws('ws://localhost:9000')\n\
  \nclient.on('open', function () {\n  console.log('open')\n  client.ping(50) // this sends\
  \ a non-zeroed buffer of 50 bytes\n\n  client.on('pong', function (data) {\n    console.log('got\
  \ pong')\n    console.log(data) // Data from the client. \n  })\n})\n```"
