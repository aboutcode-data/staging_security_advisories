summary: (CWE-284) Fixed an issue where a guest user knowing the ID of another user could get
  their information (e.g. name, surname, nickname) via Mattermost Boards by sending a request
  to POST /plugins/focalboard/api/v2/users. Thanks to DoyenSec for contributing to this improvement
  under the Mattermost responsible disclosure policy.
