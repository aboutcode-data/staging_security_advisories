aliases:
  - CVE-2021-26117
summary: |
  Improper Authentication in Apache ActiveMQ and Apache Artemis
  The optional ActiveMQ LDAP login module can be configured to use anonymous access to the LDAP server. In this case, for Apache ActiveMQ Artemis prior to version 2.16.0 and Apache ActiveMQ prior to versions 5.16.1 and 5.15.14, the anonymous context is used to verify a valid users password in error, resulting in no check on the password.
impacted_packages:
  - purl: pkg:maven/org.apache.activemq/activemq-parent
    affected_versions: vers:maven/>=5.16.0|<5.16.1
    fixed_versions: vers:maven/5.16.1
  - purl: pkg:maven/org.apache.activemq/activemq-parent
    affected_versions: vers:maven/<5.15.14
    fixed_versions: vers:maven/5.15.14
  - purl: pkg:maven/org.apache.activemq/apache-artemis
    affected_versions: vers:maven/<2.16.0
    fixed_versions: vers:maven/2.16.0
