  - CVE-2022-21741
summary: "Division by zero in TFLite\n### Impact \nAn attacker can craft a TFLite model that\
  \ would trigger a division by zero in [the implementation of depthwise convolutions](https://github.com/tensorflow/tensorflow/blob/5100e359aef5c8021f2e71c7b986420b85ce7b3d/tensorflow/lite/kernels/depthwise_conv.cc#L96).\n\
  \nThe parameters of the convolution can be user controlled and are also used within a division\
  \ operation to determine the size of the padding that needs to be added before applying the\
  \ convolution. There is no check before this division that the divisor is stricly positive.\n\
  \n### Patches              \nWe have patched the issue in GitHub commit [e5b0eec199c2d03de54fd6a7fd9275692218e2bc](https://github.com/tensorflow/tensorflow/commit/e5b0eec199c2d03de54fd6a7fd9275692218e2bc).\n\
  \  \nThe fix will be included in TensorFlow 2.8.0. We will also cherrypick this commit on\
  \ TensorFlow 2.7.1, TensorFlow 2.6.3, and TensorFlow 2.5.3, as these are also affected and\
  \ still in supported range.\n  \n### For more information\nPlease consult [our security guide](https://github.com/tensorflow/tensorflow/blob/master/SECURITY.md)\
  \ for more information regarding the security model and how to contact us with issues and\
  \ questions.\n  \n### Attribution\nThis vulnerability has been reported by Wang Xuan of Qihoo\
  \ 360 AIVul Team."
