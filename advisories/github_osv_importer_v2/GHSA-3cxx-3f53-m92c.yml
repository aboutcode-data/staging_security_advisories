  - purl: pkg:composer/concrete5/concrete5
    affected_versions: vers:composer/<8.5.10
    fixed_versions: vers:composer/8.5.10
  - purl: pkg:composer/concrete5/concrete5
    affected_versions: vers:composer/>=9.0.0|<9.1.3
