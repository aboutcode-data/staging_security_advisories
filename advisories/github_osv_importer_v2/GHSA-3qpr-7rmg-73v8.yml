aliases:
  - CVE-2012-5507
summary: |
  Plone and Zope2 affected by Race Condition
  AccessControl/AuthEncoding.py in Zope before 2.13.19, as used in Plone before 4.2.3 and 4.3 before beta 1, allows remote attackers to obtain passwords via vectors involving timing discrepancies in password validation.
impacted_packages:
  - purl: pkg:pypi/zope2
    affected_versions: vers:pypi/<2.13.19
    fixed_versions: vers:pypi/2.13.19
  - purl: pkg:pypi/plone
    affected_versions: vers:pypi/>=3.2.2|<4.2.3
    fixed_versions: vers:pypi/4.2.3
  - purl: pkg:pypi/plone
    affected_versions: vers:pypi/<=4.3a2
    fixed_versions: vers:pypi/4.3b1
