summary: "Storybook manager bundle may expose environment variables during build\nOn December\
  \ 11th, the Storybook team received a responsible disclosure alerting them to a potential\
  \ vulnerability in certain built and published Storybooks. \n\nThe vulnerability is a bug\
  \ in how Storybook handles environment variables defined in a `.env` file, which could, in\
  \ specific circumstances, lead to those variables being unexpectedly bundled into the artifacts\
  \ created by the `storybook build` command. When a built Storybook is published to the web,\
  \ the bundle’s source is viewable, thus potentially exposing those variables to anyone with\
  \ access. If those variables contained secrets, they should be considered compromised.\n\n\
  ## Who is impacted?\n\nFor a project to be vulnerable to this issue, it must:\n\n- Build the\
  \ Storybook (i.e. run `storybook build` directly or indirectly) in a directory that contains\
  \ a `.env` file (including variants like `.env.local`)\n- The `.env` file contains sensitive\
  \ secrets\n- Use Storybook version `7.0.0` or above\n- Publish the built Storybook to the\
  \ web\n\nStorybooks built without a `.env` file at build time are not affected, including\
  \ common CI-based builds where secrets are provided via platform environment variables rather\
  \ than `.env` files.\n\nUsers' Storybook runtime environments (i.e. `storybook dev`) are not\
  \ affected. Deployed applications that share a repo with a project's Storybook are not affected.\n\
  \nStorybook 6 and below are not affected.\n\n## Recommended actions\n\nFirst, Storybook recommends\
  \ that everyone audit for any sensitive secrets provided via `.env` files and rotate those\
  \ keys.\n\nSecond, Storybook has released patched versions of all affected major Storybook\
  \ versions that no longer have this vulnerability. Projects should upgrade their Storybook—on\
  \ both local machines and CI environments—to one of these versions **before publishing again**.\n\
  \n- `10.1.10+`\n- `9.1.17+`\n- `8.6.15+`\n- `7.6.21+`\n\nFinally, some projects may have been\
  \ relying on the undocumented behavior at the heart of this issue and will need to change\
  \ how they reference environment variables after this update. If a project can no longer read\
  \ necessary environmental variable values, it can either prefix the variables with `STORYBOOK_`\
  \ or use the [`env` property in Storybook’s configuration](https://storybook.js.org/docs/configure/environment-variables#using-storybook-configuration)\
  \ to manually specify values. In either case, **do not** include sensitive secrets as they\
  \ *will* be included in the built bundle.\n\n## Further information\n\nDetails of the vulnerability\
  \ can be found on the [Storybook announcement](https://storybook.js.org/blog/security-advisory)."
