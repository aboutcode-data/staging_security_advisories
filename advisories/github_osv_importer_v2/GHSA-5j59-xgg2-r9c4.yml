summary: "Next has a Denial of Service with Server Components - Incomplete Fix Follow-Up\nIt\
  \ was discovered that the fix for [CVE-2025-55184](https://github.com/advisories/GHSA-2m3v-v2m8-q956)\
  \ in React Server Components was incomplete and did not fully mitigate denial-of-service conditions\
  \ across all payload types.  As a result, certain crafted inputs could still trigger excessive\
  \ resource consumption. \n\nThis vulnerability affects React versions 19.0.2, 19.1.3, and\
  \ 19.2.2, as well as frameworks that bundle or depend on these versions, including Next.js\
  \ 13.x, 14.x, 15.x, and 16.x when using the App Router. The issue is tracked upstream as [CVE-2025-67779](https://www.cve.org/CVERecord?id=CVE-2025-67779).\n\
  \nA malicious actor can send a specially crafted HTTP request to a Server Function endpoint\
  \ that, when deserialized, causes the React Server Components runtime to enter an infinite\
  \ loop. This can lead to sustained CPU consumption and cause the affected server process to\
  \ become unresponsive, resulting in a denial-of-service condition in unpatched environments."
