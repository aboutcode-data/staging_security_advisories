summary: "Security researcher Abhishek Arya (Inferno) of the Google\nChrome Security Team discovered\
  \ a number of use-after-free and out of bounds read \nissues using the Address Sanitizer tool.\
  \ These issues are potentially exploitable, \nallowing for remote code execution. \n\nIn general\
  \ this flaw cannot be exploited through email in the\nThunderbird and Seamonky products because\
  \ scripting is disabled, but is \npotentially a risk in browser or browser-like contexts."
