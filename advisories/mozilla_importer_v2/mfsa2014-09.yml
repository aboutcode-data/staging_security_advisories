summary: "Security researcher Masato Kinugawa reported a cross-origin\ninformation leak through\
  \ web workers' error messages. This violates same-origin\npolicy and the leaked information\
  \ could potentially be used to gather\nauthentication tokens and other data from third-party\
  \ websites. \n\nIn general this flaw cannot be exploited through email in the\nThunderbird\
  \ and Seamonkey products because scripting is disabled in mail, but is\npotentially a risk\
  \ in browser or browser-like contexts."
