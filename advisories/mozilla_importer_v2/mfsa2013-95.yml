summary: "Security researcher Abhishek Arya (Inferno) of the Google\nChrome Security Team used\
  \ the Address Sanitizer tool to discover an access\nviolation due to uninitialized data during\
  \ Extensible Stylesheet Language\nTransformation (XSLT) processing. This leads to a potentially\
  \ exploitable\ncrash. \n\nIn general this flaw cannot be exploited through email in the\n\
  Thunderbird and Seamonkey products because scripting is disabled, but is\npotentially a risk\
  \ in browser or browser-like contexts."
