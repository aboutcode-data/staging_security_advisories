summary: |
  shutdown demonstrated that the crypto.generateCRMFRequest method
  can be used to run arbitrary code with the privilege of the
  user, which could enable an attacker to install malware.
  Thunderbird shares the browser engine with Firefox
  and could be vulnerable if JavaScript were to be enabled in mail. This is not
  the default setting and we strongly discourage users from running
  JavaScript in mail.
