summary: |
  An update for microcode_ctl is now available for Red Hat Enterprise Linux
  7.3 Advanced Update Support, Red Hat Enterprise Linux 7.3 Telco Extended
  Update Support, and Red Hat Enterprise Linux 7.3 Update Services for SAP
  Solutions.

  The microcode_ctl packages provide microcode updates for Intel and AMD
  processors.

  Bug Fix(es) and Enhancement(s):

  * [rhel-7.3.z] [HPEMC 7.9 REGRESSION]  Microcode_ctl  microcode_ctl
  (BZ#1907917)
