summary: "Red Hat OpenShift Container Platform release 4.7.49 is now available with\nupdates\
  \ to packages and images that fix several bugs and add enhancements.\n\nThis advisory contains\
  \ the RPM packages for Red Hat OpenShift Container Platform 4.7.49. \n\nRed Hat Product Security\
  \ has rated this update as having a security impact\nof Important. A Common Vulnerability\
  \ Scoring System (CVSS) base score,\nwhich gives a detailed severity rating, is available\
  \ for each vulnerability\nfrom the CVE link(s) in the References section.\n\nRed Hat OpenShift\
  \ Container Platform is Red Hat's cloud computing\nKubernetes application platform solution\
  \ designed for on-premise or private\ncloud deployments.\n\nSee the following advisory for\
  \ the container images for this release:\n\nhttps://access.redhat.com/errata/RHBA-2022:1337\n\
  \nSecurity Fix(es):\n\n* haproxy: Denial of service via set-cookie2 header (CVE-2022-0711)\n\
  \nFor more details about the security issue(s), including the impact, a CVSS\nscore, acknowledgments,\
  \ and other related information, refer to the CVE\npage(s) listed in the References section."
