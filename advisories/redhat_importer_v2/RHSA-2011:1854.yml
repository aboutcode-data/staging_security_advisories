summary: "Updated krb5-appl packages that fix one security issue are now available\nfor Red\
  \ Hat Enterprise Linux 6.0 and 6.1 Extended Update Support.\n\nThe Red Hat Security Response\
  \ Team has rated this update as having critical\nsecurity impact. A Common Vulnerability Scoring\
  \ System (CVSS) base score,\nwhich gives a detailed severity rating, is available from the\
  \ CVE link in\nthe References section.\n\nThe krb5-appl packages provide Kerberos-aware telnet,\
  \ ftp, rcp, rsh, and\nrlogin clients and servers. Kerberos is a network authentication system\n\
  which allows clients and servers to authenticate to each other using\nsymmetric encryption\
  \ and a trusted third-party, the Key Distribution Center\n(KDC).\n\nA buffer overflow flaw\
  \ was found in the MIT krb5 telnet daemon (telnetd).\nA remote attacker who can access the\
  \ telnet port of a target machine could\nuse this flaw to execute arbitrary code as root.\
  \ (CVE-2011-4862) \n\nNote that the krb5 telnet daemon is not enabled by default in any version\n\
  of Red Hat Enterprise Linux. In addition, the default firewall rules block\nremote access\
  \ to the telnet port. This flaw does not affect the telnet\ndaemon distributed in the telnet-server\
  \ package.\n\nFor users who have installed the krb5-appl-servers package, have enabled\nthe\
  \ krb5 telnet daemon, and have it accessible remotely, this update should\nbe applied immediately.\
  \ \n\nAll krb5-appl-server users should upgrade to these updated packages, which\ncontain\
  \ a backported patch to correct this issue."
