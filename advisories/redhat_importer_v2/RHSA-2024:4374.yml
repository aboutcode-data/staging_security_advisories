aliases:
  - CVE-2024-4467
summary: |
  An update for the virt:rhel module is now available for Red Hat Enterprise Linux 8.4 Advanced Mission Critical Update Support, Red Hat Enterprise Linux 8.4 Telecommunications Update Service, and Red Hat Enterprise Linux 8.4 Update
  Services for SAP Solutions.

  Red Hat Product Security has rated this update as having a security impact of
  Important. A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating, is available for each vulnerability from the CVE link(s) in the References section.

  Kernel-based Virtual Machine (KVM) offers a full virtualization solution for
  Linux on numerous hardware platforms. The virt:rhel module contains packages
  which provide user-space components used to run virtual machines using KVM. The packages also provide APIs for managing and interacting with the virtualized systems.

  Security Fix(es):

  * qemu-kvm: QEMU: 'qemu-img info' leads to host file read/write (CVE-2024-4467)

  For more details about the security issue(s), including the impact, a CVSS
  score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.
