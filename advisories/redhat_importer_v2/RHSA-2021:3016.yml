summary: "Red Hat Advanced Cluster Management for Kubernetes 2.3.0 General\nAvailability release\
  \ images, which fix several bugs and security issues. \n\nRed Hat Product Security has rated\
  \ this update as having a security impact\nof Important. A Common Vulnerability Scoring System\
  \ (CVSS) base score,\nwhich gives a detailed severity rating, is available for each vulnerability\n\
  from the CVE links in the References section.\n\nRed Hat Advanced Cluster Management for Kubernetes\
  \ 2.3.0 images\n\nRed Hat Advanced Cluster Management for Kubernetes provides the\ncapabilities\
  \ to address common challenges that administrators and site\nreliability engineers face as\
  \ they work across a range of public and\nprivate cloud environments. Clusters and applications\
  \ are all visible and\nmanaged from a single console—with security policy built in.\n\nThis\
  \ advisory contains the container images for Red Hat Advanced Cluster\nManagement for Kubernetes,\
  \ which fix several bugs and security issues. See\nthe following Release Notes documentation,\
  \ which will be updated shortly\nfor this release, for additional details about this release:\n\
  \nhttps://access.redhat.com/documentation/en-us/red_hat_advanced_cluster_mana\ngement_for_kubernetes/2.3/html/release_notes/\n\
  \nSecurity:\n\n* fastify-reply-from: crafted URL allows prefix scape of the proxied backend\
  \ service (CVE-2021-21321)\n\n* fastify-http-proxy: crafted URL allows prefix scape of the\
  \ proxied\nbackend service (CVE-2021-21322)\n\n* nodejs-netmask: improper input validation\
  \ of octal input data (CVE-2021-28918)\n\n* redis: Integer overflow via STRALGO LCS command\
  \ (CVE-2021-29477)\n\n* redis: Integer overflow via COPY command for large intsets (CVE-2021-29478)\n\
  \n* nodejs-glob-parent: Regular expression denial of service (CVE-2020-28469)\n\n* nodejs-lodash:\
  \ ReDoS via the toNumber, trim and trimEnd functions\n(CVE-2020-28500)\n\n* golang.org/x/text:\
  \ Panic in language.ParseAcceptLanguage while parsing -u- extension (CVE-2020-28851)\n\n*\
  \ golang.org/x/text: Panic in language.ParseAcceptLanguage while processing\nbcp47 tag (CVE-2020-28852)\n\
  \n* nodejs-ansi_up: XSS due to insufficient URL sanitization (CVE-2021-3377)\n\n* oras: zip-slip\
  \ vulnerability via oras-pull (CVE-2021-21272)\n\n* redis: integer overflow when configurable\
  \ limit for maximum supported bulk input size is too big on 32-bit platforms (CVE-2021-21309)\n\
  \n* nodejs-lodash: command injection via template (CVE-2021-23337)\n\n* nodejs-hosted-git-info:\
  \ Regular Expression denial of service via shortcutMatch in fromUrl() (CVE-2021-23362)\n\n\
  * browserslist: parsing of invalid queries could result in Regular Expression Denial of Service\
  \ (ReDoS) (CVE-2021-23364)\n\n* nodejs-postcss: Regular expression denial of service during\
  \ source map parsing (CVE-2021-23368)\n\n* nodejs-handlebars: Remote code execution when compiling\
  \ untrusted compile templates with strict:true option (CVE-2021-23369)\n\n* nodejs-postcss:\
  \ ReDoS via getAnnotationURL() and loadAnnotation() in lib/previous-map.js (CVE-2021-23382)\n\
  \n* nodejs-handlebars: Remote code execution when compiling untrusted compile templates with\
  \ compat:true option (CVE-2021-23383)\n\n* openssl: integer overflow in CipherUpdate (CVE-2021-23840)\n\
  \n* openssl: NULL pointer dereference in X509_issuer_and_serial_hash()\n(CVE-2021-23841)\n\
  \n* nodejs-ua-parser-js: ReDoS via malicious User-Agent header (CVE-2021-27292)\n\n* grafana:\
  \ snapshot feature allow an unauthenticated remote attacker to trigger a DoS via a remote\
  \ API call (CVE-2021-27358)\n\n* nodejs-is-svg: ReDoS via malicious string (CVE-2021-28092)\n\
  \n* nodejs-netmask: incorrectly parses an IP address that has octal integer with invalid character\
  \ (CVE-2021-29418)\n\n* ulikunitz/xz: Infinite loop in readUvarint allows for denial of service\
  \ (CVE-2021-29482)\n\n* normalize-url: ReDoS for data URLs (CVE-2021-33502)\n\n* nodejs-trim-newlines:\
  \ ReDoS in .end() method (CVE-2021-33623)\n\n* nodejs-path-parse: ReDoS via splitDeviceRe,\
  \ splitTailRe and splitPathRe (CVE-2021-23343)\n\n* html-parse-stringify: Regular Expression\
  \ DoS (CVE-2021-23346)\n\n* openssl: incorrect SSLv2 rollback protection (CVE-2021-23839)\n\
  \nFor more details about the security issues, including the impact, a CVSS\nscore, acknowledgments,\
  \ and other related information, refer to the CVE\npages listed in the References section.\n\
  \nBugs:\n\n* RFE Make the source code for the endpoint-metrics-operator public (BZ# 1913444)\n\
  \n* cluster became offline after apiserver health check (BZ# 1942589)"
