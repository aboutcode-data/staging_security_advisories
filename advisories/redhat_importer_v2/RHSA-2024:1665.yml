summary: "Red Hat Advanced Cluster Management for Kubernetes 2.8.6 is now available. \n\nRed\
  \ Hat Product Security has rated this update as having a security impact of Moderate. A Common\
  \ Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating,\
  \ is available for each vulnerability from the CVE link(s) in the References section.\n\n\
  Red Hat Advanced Cluster Management for Kubernetes 2.8.6 images\n\nRed Hat Advanced Cluster\
  \ Management for Kubernetes provides the\ncapabilities to address common challenges that administrators\
  \ and site\nreliability engineers face as they work across a range of public and\nprivate\
  \ cloud environments. Clusters and applications are all visible and\nmanaged from a single\
  \ console—with security policy built in.\n\nThis advisory contains the container images for\
  \ Red Hat Advanced Cluster\nManagement for Kubernetes, which fix several bugs. See the following\n\
  Release Notes documentation, which will be updated shortly for this\nrelease, for additional\
  \ details about this release:\n\nhttps://access.redhat.com/documentation/en-us/red_hat_advanced_cluster_management_for_kubernetes/2.8/html/release_notes/\n\
  \nSecurity Fix(es) from Bugzilla:\n\n* golang-protobuf: encoding/protojson, internal/encoding/json:\
  \ infinite loop in protojson.Unmarshal when unmarshaling certain forms of invalid JSON (CVE-2024-24786)\n\
  \nFor more details about the security issue(s), including the impact, a CVSS score, and other\
  \ related information, refer to the CVE page(s) listed in the References section.\n\nJira\
  \ issues addressed:\n \n* ACM-9886: Console initial loading time increases over time\n* ACM-10159:\
  \ ACM 2.8 permission error after the restore process"
