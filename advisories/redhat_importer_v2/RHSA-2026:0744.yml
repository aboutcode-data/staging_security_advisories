summary: "An update for libpq is now available for Red Hat Enterprise Linux 8.4 Advanced Mission\
  \ Critical Update Support and Red Hat Enterprise Linux 8.4 Extended Update Support Long-Life\
  \ Add-On.\n\nRed Hat Product Security has rated this update as having a security impact of\
  \ Moderate. A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed\
  \ severity rating, is available for each vulnerability from the CVE link(s) in the References\
  \ section.\n\nThe libpq package provides the PostgreSQL client library, which allows client\
  \ programs to connect to PostgreSQL servers. \n\nSecurity Fix(es):\n\n* postgresql: libpq\
  \ undersizes allocations, via integer wraparound (CVE-2025-12818)\n\nFor more details about\
  \ the security issue(s), including the impact, a CVSS score, acknowledgments, and other related\
  \ information, refer to the CVE page(s) listed in the References section."
