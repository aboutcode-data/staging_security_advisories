summary: |
  An updated Adobe Flash Player package that fixes multiple security issues
  is now available for Red Hat Enterprise Linux 5 and 6 Supplementary.

  Red Hat Product Security has rated this update as having Critical security
  impact. Common Vulnerability Scoring System (CVSS) base scores, which give
  detailed severity ratings, are available for each vulnerability from the
  CVE links in the References section.

  The flash-plugin package contains a Mozilla Firefox compatible Adobe Flash
  Player web browser plug-in.

  This update fixes multiple vulnerabilities in Adobe Flash Player. These
  vulnerabilities are detailed in the Adobe Security Bulletin APSB15-02, and APSB15-03, listed in the References section.

  Multiple flaws were found in the way flash-plugin displayed certain SWF
  content. An attacker could use these flaws to create a specially crafted
  SWF file that would cause flash-plugin to crash or, potentially, execute
  arbitrary code when the victim loaded a page containing the malicious SWF
  content. (CVE-2015-0310, CVE-2015-0311, CVE-2015-0312)

  All users of Adobe Flash Player should install this updated package, which
  upgrades Flash Player to version 11.2.202.440.
